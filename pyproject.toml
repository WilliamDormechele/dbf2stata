[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dbf2stata"
version = "0.1.0"
description = "Convert DBF files to Stata .dta files with robust type and date handling."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "William Dormechele"}
]
keywords = ["dbf", "dbase", "foxpro", "stata", "dta", "data-conversion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "dbfread>=2.0.7",
  "pandas>=2.2"
]

[project.scripts]
dbf2stata = "dbf2stata.cli:main"

[project.urls]
Homepage = "https://github.com/WilliamDormechele/dbf2stata"
Repository = "https://github.com/WilliamDormechele/dbf2stata"
Issues = "https://github.com/WilliamDormechele/dbf2stata/issues"

[project.optional-dependencies]
test = [
  "pytest>=8"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"